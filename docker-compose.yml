services:
  frontend:
    build:
      context: ./front-end
      args:
        VITE_API_BASE_URL: ""
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"

  backend:
    build:
      context: ./back-end
    environment:
      NODE_ENV: production
      PORT: 3000
      MONGO_URI: ${MONGO_URI:?Set MONGO_URI in .env or your shell}
      REDIS_URL: ${REDIS_URL:?Set REDIS_URL in .env or your shell}
      SEATS_AERO_API: ${SEATS_AERO_API:?Set SEATS_AERO_API in .env or your shell}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env or your shell}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
    ports:
      - "3000:3000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://localhost:3000/').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
